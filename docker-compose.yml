services:
  db:
    image: postgres:16-alpine
    container_name: my-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FarriottPassword123!
      POSTGRES_DB: EXE_Farriott
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-dotnet-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Chuỗi kết nối trỏ thẳng tới service 'db'
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=EXE_Farriott;Username=postgres;Password=FarriottPassword123!"
    depends_on:
      - db